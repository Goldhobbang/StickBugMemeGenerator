name: Import and analyze RickRoll reference GIF

on:
  push:
    paths:
      - '.github/workflows/import-rickroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download GIF, inspect frames and build contact sheet
        run: python scripts/analyze_rickroll.py
      - name: Prepare web-resolution GIF and inspect the RickRoll transition
        run: python scripts/prepare_rickroll.py
      - name: Commit source GIF and frame analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rick-roll.gif public/rick-roll-256.gif docs/rickroll-analysis.json docs/rickroll-contact.jpg docs/rickroll-keyframes.jpg
          if git diff --cached --quiet; then
            echo "No source asset changes"
          else
            git commit -m "assets: import original RickRoll GIF with frame analysis"
            git push
          fi
